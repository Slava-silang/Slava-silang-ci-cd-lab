name: Pipeline

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check HTML
        run: npx --yes htmlhint --rules "doctype-first,tag-pair,id-unique,title-require" index.html

      - name: Build Docker image
        run: docker build -t lab-site .

      - name: Smoke test container
        run: |
          docker run -d --name lab-container -p 8080:80 lab-site
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 5 http://localhost:8080 -o response.html
          grep -F "Slava-silang" response.html
          echo "OK"

      - name: Stop container
        if: always()
        run: docker rm -f lab-container || true

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE" .
          docker push "$IMAGE"
